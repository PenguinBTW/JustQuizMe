<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Print Test</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="/shared/css/print.css" />
<script>window.renderMath = function(){};</script>
</head>
<body>
<header class="topbar"><div class="brand">Physics</div></header>
<main class="stage" id="stage"></main>
<script type="module">
import { S } from '/physics/js/state.js';
import { beginRun } from '/physics/js/runner/assessment.js';
try {
  beginRun({
    mode: 'quiz',
    quizLike: {
      uuid: 'print-test', version: 1, title: 'Mixed · 8m (3Q)', timeLimitMinutes: 12,
      questions: [
        { id: 'q1', type: 'multiple-choice', topic: 't', subtopic: 's', marks: 1, prompt: 'Pick one.', options: ['Alpha', 'Beta'], correctIndex: 1 },
        { id: 'q2', type: 'self-marked', topic: 't', subtopic: 's', marks: 2, prompt: 'Describe the effect.', answerText: 'It doubles.', markScheme: [{ marks: 1, text: 'Mentions wavelength' }, { marks: 1, text: 'Links amplitude' }] },
        { id: 'q3', type: 'written', topic: 't', subtopic: 's', marks: 5, prompt: 'Explain refraction with a diagram.', guidance: 'Use labelled rays.', markScheme: [{ marks: 2, text: 'Normal drawn' }], table: { caption: 'Data', headers: ['a', 'b'], rows: [[1, 2]] } },
      ],
    },
    meta: { category: 'past-paper', file: 'mixed', virtual: true },
  });
  window.__ready = true;
} catch (e) { document.getElementById('stage').textContent = 'ERR ' + e.message + ' ' + e.stack; window.__err = String(e); }
</script>
</body>
</html>
