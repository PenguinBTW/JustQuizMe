<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Physics JustQuizMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<script>
window.renderMath = function () {
  try {
    if (typeof renderMathInElement === 'undefined') return;
    renderMathInElement(document.getElementById('stage') || document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    });
  } catch (e) { /* math is decorative - never break rendering */ }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="window.renderMath()"></script>
</head>
<body>
<header class="topbar">
  <div class="brand" id="brandHome" title="Back to Past Papers">
    <img src="favicon.png" alt="JustQuizMe Logo" class="brand-logo" />
    <div class="brand-text">
      <span class="brand-title">Physics JustQuizMe</span>
      <span class="brand-sub">AQA 7408</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="mono" style="font-size:12px; color:var(--ink-muted);" id="bankStats">…</span>
    <button class="theme-btn" id="themeBtn">Paper</button>
  </div>
</header>

<main class="stage" id="stage"></main>

<!-- Step 2: synthesizer subtopics + marks + quiz/exam -->
<div class="modal-backdrop" id="synthModal">
  <div class="modal-card wide">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
      <span class="mono" style="font-size:11px; color:var(--accent); text-transform:uppercase;">Custom Paper Synthesizer · Step 2 of 2</span>
      <button class="btn-ghost" id="synthClose">✕</button>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:12px;">
      <div>
        <h3 class="serif" style="font-size:28px;">Configure Subtopics &amp; Paper Size</h3>
        <p style="font-size:13px; color:var(--ink-secondary);" id="synthModalSubtitle"></p>
      </div>
      <button class="btn" style="padding:5px 14px; font-size:12px;" id="synthToggleAllBtn">Deselect all</button>
    </div>
    <div class="modal-subtopics-scroll" id="synthModalSubtopicGroups"></div>
    <div class="slider-wrap" style="margin-bottom:14px;">
      <span class="mono" style="font-size:12px; color:var(--ink-secondary);">Marks</span>
      <input type="range" min="5" max="60" value="45" id="synthModalSlider" />
      <span class="mono" style="font-size:14px; font-weight:600; min-width:76px; text-align:right;" id="synthModalMarksLabel">45 marks</span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; padding-top:14px; border-top:1px solid var(--border);">
      <div class="segmented" id="synthModeSeg">
        <button data-seg="standard" class="active">Standard</button>
        <button data-seg="random">Random</button>
      </div>
      <div class="segmented" id="synthPaceSeg" title="Exam time limit — opt-in; cannot be paused once running">
        <button data-pace="untimed">Untimed</button>
        <button data-pace="relaxed">Relaxed</button>
        <button data-pace="standard" class="active">Standard</button>
        <button data-pace="strict">Strict</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="synthStartQuizBtn">Start Quiz ↑</button>
        <button class="btn btn-primary" id="synthStartExamBtn">Start Exam · 68m ⏱</button>
      </div>
    </div>
  </div>
</div>

<!-- Topic quiz builder -->
<div class="modal-backdrop" id="topicModal">
  <div class="modal-card">
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
      <span class="mono" style="font-size:11px; color:var(--accent); text-transform:uppercase;">Topic Quiz Builder</span>
      <button class="btn-ghost" id="topicClose">✕</button>
    </div>
    <h3 class="serif" style="font-size:28px; margin-bottom:16px;" id="modalTopicTitle"></h3>
    <div class="slider-wrap" style="margin-bottom:16px;">
      <span class="mono" style="font-size:12px; color:var(--ink-secondary);">Marks</span>
      <input type="range" min="5" max="50" value="20" id="modalSlider" />
      <span class="mono" style="font-size:14px; font-weight:600; min-width:74px; text-align:right;" id="modalMarksLabel">20 marks</span>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span style="font-size:13px; color:var(--ink-secondary);">Question Order</span>
      <div class="segmented" id="topicModeSeg">
        <button data-seg="standard" class="active">Standard</button>
        <button data-seg="random">Random</button>
      </div>
    </div>
    <div class="dist-preview-box">
      <div class="mono" style="font-size:11.5px; color:var(--ink-muted); margin-bottom:6px;" id="modalSummaryLine"></div>
      <div id="modalSubtopicRows"></div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button class="btn" id="topicStartQuizBtn">Start Quiz ↑</button>
      <button class="btn btn-primary" id="modalExamBtn">Start Exam · 30m ⏱</button>
    </div>
  </div>
</div>

<script type="module" src="/shared/js/mountExamTimer.js"></script>
<script type="module" src="js/main.js"></script>
<script type="module">
  import { S } from './js/state.js';
  import { registerDaily } from '/shared/js/mountDaily.js';
  registerDaily({ portal: 'physics', S });
</script>
</body>
</html>
